name: Release
# Pushing a tag like v0.4.1 publishes a GitHub release whose notes are the matching CHANGELOG.md section.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match manifest version
        run: |
          v=$(python3 -c "import json;print(json.load(open('custom_components/deeper_connect/manifest.json'))['version'])")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != manifest v$v"; exit 1; }
      - name: Extract release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '$0=="## "v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no CHANGELOG.md section '## $ver'"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
